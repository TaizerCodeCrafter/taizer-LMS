<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#ff4d6d" />
      <stop offset="100%" stopColor="#d90429" />
    </linearGradient>
    <linearGradient id="favGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#00f5d4" />
      <stop offset="100%" stopColor="#00bbf9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="16" fill="#070b14" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#1e293b" stroke-width="1.5" />

  <!-- Red Candle (Left) -->
  <line x1="23" y1="12" x2="23" y2="22" stroke="#ff4d6d" stroke-width="2.5" stroke-linecap="round" />
  <rect x="17" y="22" width="12" height="18" rx="2.5" fill="url(#favRed)" stroke="#ff4d6d" stroke-width="1" filter="url(#glow)" />
  <line x1="23" y1="40" x2="23" y2="50" stroke="#ff4d6d" stroke-width="2.5" stroke-linecap="round" />

  <!-- Green Candle (Right, Taller) -->
  <line x1="41" y1="8" x2="41" y2="16" stroke="#00f5d4" stroke-width="2.5" stroke-linecap="round" />
  <rect x="35" y="16" width="12" height="28" rx="2.5" fill="#10b981" stroke="#34d399" stroke-width="1.2" filter="url(#glow)" />
  <line x1="41" y1="44" x2="41" y2="54" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
</svg>
